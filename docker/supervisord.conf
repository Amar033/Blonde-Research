[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[program:vllm]
command=python3 -m vllm.entrypoints.openai.api_server --model shuyuej/Llama-3.3-70B-Instruct-GPTQ --quantization gptq --host 0.0.0.0 --port 8000 --max-model-len 8192 --served-model-name llama-3.3-70b-instruct
directory=/app
stdout_logfile=/var/log/supervisor/vllm.out.log
stderr_logfile=/var/log/supervisor/vllm.err.log
autostart=true
autorestart=true
priority=5
stopsignal=INT

[program:backend]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/app/backend
stdout_logfile=/var/log/supervisor/backend.out.log
stderr_logfile=/var/log/supervisor/backend.err.log
autostart=true
autorestart=true
priority=10
stopsignal=INT

[program:frontend]
command=npm run start
directory=/app/frontend
stdout_logfile=/var/log/supervisor/frontend.out.log
stderr_logfile=/var/log/supervisor/frontend.err.log
autostart=true
autorestart=true
priority=20
stopsignal=INT
